name: Inspect existing staging incident (read only)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/staging-inspect.yml
      - scripts/staging-inspect.mjs
permissions:
  contents: read
concurrency:
  group: clearallergy-dedicated-staging
  queue: max
  cancel-in-progress: false
jobs:
  inspect:
    if: github.ref == 'refs/heads/main' && vars.STAGING_ACTIONS_ENABLED == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: staging
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - name: Read only the pinned incident deployment and fixed alias
        env:
          VERCEL_TOKEN: ${{ secrets.STAGING_VERCEL_TOKEN }}
        run: node scripts/staging-inspect.mjs
