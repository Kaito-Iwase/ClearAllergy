services:
  app:
    build: .
    ports:
      - "127.0.0.1:3100:3000"
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
      - app_next:/app/.next
    env_file:
      - path: .env
        required: false
      - path: .env.local
        required: false
    environment:
      NEXT_TELEMETRY_DISABLED: "1"

volumes:
  app_node_modules:
  app_next:
